name: Dispatch esmini WASM publishing

on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+ # Run on esmini version tags
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    if: github.event_name != 'push' || !github.event.deleted # Manual dispatch is != push || not ran on tag deletion
    runs-on: ubuntu-22.04

    steps:
      - name: Dispatch Pages workflow in esmini-wasm
        env:
          GH_TOKEN: ${{ secrets.ESMINI_WASM_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the ESMINI_WASM_DISPATCH_TOKEN Actions secret."
            exit 1
          fi
          # Use github CLI to start workflow from target repos main branch, and build esminis master branch
          gh workflow run publish_esmini_wasm.yml \
            --repo slundel6/esmini-wasm --ref main -f esmini_branch=pr852
