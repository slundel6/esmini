name: "Run osc-validation"
description: "Install osc-validation, run pytest suite with HTML report, and collect artifacts"
runs:
  using: "composite"
  steps:

    - name: Set osc-validation pinned ref
      shell: bash
      run: |
        # Single source of truth for the pinned osc-validation tag/ref.
        # Update this value alone to bump the version used by the steps below.
        echo "OSC_VALIDATION_REF=v0.2.0" >> "$GITHUB_ENV"

    - name: Check for new osc-validation tags
      shell: bash
      run: |
        PINNED_TAG="$OSC_VALIDATION_REF"

        LATEST_TAG="$(git ls-remote --tags --refs https://github.com/PMSFIT/osc-validation.git \
          | awk -F'refs/tags/' '{print $2}' \
          | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
          | sort -V | tail -n1)"

        echo "Pinned osc-validation tag:  $PINNED_TAG"
        echo "Latest osc-validation tag:  $LATEST_TAG"

        if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "$PINNED_TAG" ]; then
          echo "::notice::A newer osc-validation tag is available: $LATEST_TAG (currently pinned to $PINNED_TAG). Consider updating OSC_VALIDATION_REF in .github/actions/run_osc_validation/action.yml & generating an updated whitelist.txt using scripts/sync_osc_validation_whitelist.py"
        else
          echo "osc-validation is up to date ($PINNED_TAG)."
        fi

    - name: Checkout osc-validation
      uses: actions/checkout@v4
      with:
        repository: PMSFIT/osc-validation
        ref: ${{ env.OSC_VALIDATION_REF }}
        fetch-depth: 1
        path: osc-validation

    - name: Set up Python venv
      shell: bash
      run: |
        pushd osc-validation
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -e . "numpy<2.0"
        popd

    - name: Run explicit permutations
      shell: bash
      run: |
        pushd osc-validation
        source .venv/bin/activate

        "$GITHUB_ACTION_PATH/run_explicit_permutations.sh" \
          "$GITHUB_ACTION_PATH/whitelist.txt" \
          "$(pwd)/../bin/esmini"
        exitcode=$?

        popd
        exit "$exitcode"

    - name: Upload osc-validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: osc-validation
        path: osc-validation/osc_validation_results
