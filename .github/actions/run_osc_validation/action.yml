name: "Run osc-validation"
description: "Install osc-validation, run pytest suite with HTML report, and collect artifacts"
runs:
  using: "composite"
  steps:

    - name: Checkout osc-validation
      uses: actions/checkout@v4
      with:
        repository: PMSFIT/osc-validation
        ref: v0.2.0
        fetch-depth: 1
        path: osc-validation

    - name: Set up Python venv
      shell: bash
      run: |
        pushd osc-validation
        python3 -m venv .venv
        source .venv/bin/activate
        pip install -e . "numpy<2.0"
        popd

    - name: Run explicit permutations
      shell: bash
      run: |
        pushd osc-validation
        source .venv/bin/activate

        SIM_BIN="$(pwd)/../bin/esmini"
        echo "Using esmini binary: $SIM_BIN"

        # Unroll the whitelist into an array of tests to run, honoring
        # INCLUDE/EXCLUDE/DEVIATION keywords (blank lines and '#' comments are
        # ignored). DEVIATION tests run alongside INCLUDE tests, but are
        # expected to fail as documented via test_profile.toml's [[xfail]].
        tests=()
        included_count=0
        excluded_count=0
        deviation_count=0
        while read -r keyword test; do
          [ -z "$keyword" ] && continue
          case "$keyword" in
            \#*) continue ;;
            INCLUDE) tests+=("$test"); included_count=$((included_count + 1)) ;;
            DEVIATION) tests+=("$test"); deviation_count=$((deviation_count + 1)) ;;
            EXCLUDE) echo "Excluding: $test"; excluded_count=$((excluded_count + 1)) ;;
            *) echo "Unknown keyword '$keyword' in whitelist.txt" >&2; exit 1 ;;
          esac
        done < "$GITHUB_ACTION_PATH/whitelist.txt"
        total_count=$((included_count + excluded_count + deviation_count))

        echo "Included tests:  $included_count"
        echo "Excluded tests:  $excluded_count"
        echo "Deviation tests: $deviation_count"
        echo "Total tests:     $total_count"

        if [ "${#tests[@]}" -eq 0 ]; then
          echo "No INCLUDE/DEVIATION tests found in whitelist.txt"
          exit 1
        fi

        echo "Running tests:"
        printf '  %s\n' "${tests[@]}"

        set +e
        pytest \
          "${tests[@]}" \
          --toolpath "$SIM_BIN" \
          --tool ESMini \
          --test-profile "$GITHUB_ACTION_PATH/test_profile.toml" \
          2>&1 | tee /tmp/osc_validation_explicit_permutations.log
        exitcode=${PIPESTATUS[0]}
        set -e

        # pytest's final summary line looks like:
        #   "1 failed, 2 passed, 1 xfailed in 3.50s"
        # Extract the count for each outcome category it reports.
        get_count() {
          grep -oE "[0-9]+ $1" /tmp/osc_validation_explicit_permutations.log | tail -n1 | grep -oE '^[0-9]+' || echo 0
        }
        passed_count="$(get_count passed)"
        failed_count="$(get_count failed)"
        deviated_count="$(get_count xfailed)"
        unexpectedly_passed_count="$(get_count xpassed)"

        echo "Passed:              $passed_count"
        echo "Failed:              $failed_count"
        echo "Deviated (xfailed):  $deviated_count"
        echo "Unexpectedly passed: $unexpectedly_passed_count"

        {
          echo "### osc-validation explicit permutations"
          echo
          echo "**Whitelist:**"
          echo "- Included: $included_count"
          echo "- Excluded: $excluded_count"
          echo "- Deviation: $deviation_count"
          echo "- Total: $total_count"
          echo
          echo "**Run results:**"
          echo "- Passed: $passed_count"
          echo "- Failed: $failed_count"
          echo "- Deviated: $deviated_count"
          if [ "$unexpectedly_passed_count" != "0" ]; then
            echo "- Unexpectedly passed (no longer deviates): $unexpectedly_passed_count"
          fi
        } | tee -a "$GITHUB_STEP_SUMMARY"

        popd
        exit "$exitcode"

    - name: Upload osc-validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: osc-validation
        path: osc-validation/osc_validation_results

    - name: Print xfail profile
      if: always()
      shell: bash
      run: |
        profile="$GITHUB_ACTION_PATH/test_profile.toml"

        {
          echo "### osc-validation expected failures"
          echo
          awk '
            /^\[\[xfail\]\]/ {
              if (test != "") {
                printf "- %s\n", test
                printf "  %s\n\n", reason
              }
              test = ""
              reason = ""
              next
            }
            /^test[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/"[[:space:]]*$/, "")
              test = $0
              next
            }
            /^reason[[:space:]]*=/ {
              sub(/^[^=]*=[[:space:]]*"/, "")
              sub(/"[[:space:]]*$/, "")
              reason = $0
              next
            }
            END {
              if (test != "") {
                printf "- %s\n", test
                printf "  %s\n", reason
              }
            }
          ' "$profile"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Fail if tests failed
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.run_tests.outputs.exitcode }}" != "0" ]; then
          echo "osc-validation failed"
          exit 1
        fi
